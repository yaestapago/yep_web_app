<div class="date-range">
  <button type="button" class="date-range__button" (click)="toggle()" aria-label="Rango del resumen">
    <svg lucideCalendarDays aria-hidden="true"></svg>
    <span>{{ label() }}</span>
    <svg class="date-range__chevron" lucideChevronDown aria-hidden="true"></svg>
  </button>

  @if (open()) {
    <div class="date-range__panel">
      <div class="date-range__presets">
        @for (option of presets; track option.id) {
          <button type="button" class="date-range__preset" (click)="choosePreset(option.id)">
            {{ option.label }}
          </button>
        }
      </div>
      <div class="date-range__custom">
        <input
          type="date"
          class="date-range__input"
          [value]="customFrom()"
          (input)="customFrom.set($any($event.target).value)"
          aria-label="Fecha inicial"
        />
        <input
          type="date"
          class="date-range__input"
          [value]="customTo()"
          (input)="customTo.set($any($event.target).value)"
          aria-label="Fecha final"
        />
        <button type="button" class="date-range__apply" (click)="applyCustom()">Aplicar</button>
      </div>
    </div>
  }
</div>
