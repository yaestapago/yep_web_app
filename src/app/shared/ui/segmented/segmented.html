@for (option of options(); track option.value; let i = $index) {
  <button
    type="button"
    role="tab"
    class="yep-segmented__option"
    [class.yep-segmented__option--active]="option.value === value()"
    [attr.aria-selected]="option.value === value() ? 'true' : 'false'"
    [tabIndex]="i === focusIndex() ? 0 : -1"
    (click)="select(option.value)"
  >
    <span class="yep-segmented__label">{{ option.label }}</span>
    @if (option.count !== undefined && option.count !== null) {
      <span class="yep-segmented__count">{{ option.count }}</span>
    }
  </button>
}
