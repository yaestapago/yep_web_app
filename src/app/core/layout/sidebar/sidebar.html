<aside class="sidebar">
  <a class="user-card" routerLink="/settings" (click)="onNavigate()" aria-label="Perfil y configuración">
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    <span class="user-meta">
      <span class="user-name">{{ fullName() }}</span>
      <span class="user-email">{{ user()?.email }}</span>
    </span>
  </a>

  <!-- Negocio activo: contexto siempre visible + cambio rápido -->
  <div class="business-switcher">
    <span class="business-switcher__icon" aria-hidden="true"><svg lucideBuilding2></svg></span>
    <span class="business-switcher__meta">
      <span class="business-switcher__label">Negocio</span>
      <span class="business-switcher__name">{{ activeBusinessName() }}</span>
    </span>
    <svg class="business-switcher__chevron" lucideChevronsUpDown aria-hidden="true"></svg>
    <label class="visually-hidden" for="business-switcher-select">Cambiar de negocio</label>
    <select
      id="business-switcher-select"
      class="business-switcher__select"
      [value]="activeBusinessAccountId() ?? ''"
      (change)="switchBusiness($event)"
    >
      @for (membership of memberships(); track membership.businessAccountId) {
        <option [value]="membership.businessAccountId">
          {{ businessName(membership.businessAccountId) }}
        </option>
      }
    </select>
  </div>

  <button type="button" class="create-business" (click)="openCreate()">
    <svg lucidePlus aria-hidden="true"></svg>
    <span>Crear negocio</span>
  </button>

  <nav class="nav-group" aria-label="Navegación principal">
    <a routerLink="/home" routerLinkActive="active" (click)="onNavigate()">
      <svg lucideHouse aria-hidden="true"></svg>
      <span>Home</span>
    </a>
    <a routerLink="/dashboard" routerLinkActive="active" (click)="onNavigate()">
      <svg lucideLayoutDashboard aria-hidden="true"></svg>
      <span>Dashboard</span>
    </a>
    <a routerLink="/businesses" routerLinkActive="active" (click)="onNavigate()">
      <svg lucideBuilding2 aria-hidden="true"></svg>
      <span>Negocios</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button
      class="theme-toggle"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="themeLabel()"
    >
      @if (isDark()) {
        <svg lucideSun aria-hidden="true"></svg>
        <span>Modo claro</span>
      } @else {
        <svg lucideMoon aria-hidden="true"></svg>
        <span>Modo oscuro</span>
      }
    </button>

    <a class="nav-settings" routerLink="/settings" routerLinkActive="active" (click)="onNavigate()">
      <svg lucideSettings aria-hidden="true"></svg>
      <span>Configuración</span>
    </a>

    <button class="logout" type="button" (click)="logout()">
      <svg lucideLogOut aria-hidden="true"></svg>
      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>

<app-create-business-modal
  [open]="createOpen()"
  (closeRequested)="closeCreate()"
  (created)="onCreated($event)"
/>
