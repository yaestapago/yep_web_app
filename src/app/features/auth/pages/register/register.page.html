<main class="auth-page register-page">
  <section class="auth-panel">
    <div class="brand-mark">
      <svg lucideShieldCheck aria-hidden="true"></svg>
    </div>

    <div class="auth-heading">
      <p>Nuevo usuario</p>
      <h1>yep_web</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field-grid">
        <label>
          <span>Nombre</span>
          <input type="text" formControlName="firstName" autocomplete="given-name" />
          @if (isInvalid('firstName')) {
            <small>Ingresa tu nombre.</small>
          }
        </label>

        <label>
          <span>Apellido</span>
          <input type="text" formControlName="lastName" autocomplete="family-name" />
          @if (isInvalid('lastName')) {
            <small>Ingresa tu apellido.</small>
          }
        </label>

        <label>
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="email" />
          @if (isInvalid('email')) {
            <small>Ingresa un email valido.</small>
          }
        </label>

        <label>
          <span>Identificacion</span>
          <input type="text" formControlName="identificationNumber" autocomplete="off" />
          @if (isInvalid('identificationNumber')) {
            <small>Ingresa tu numero de identificacion.</small>
          }
        </label>

        <label>
          <span>Celular</span>
          <input type="tel" formControlName="cellphoneNumber" autocomplete="tel" />
          @if (isInvalid('cellphoneNumber')) {
            <small>Ingresa tu celular.</small>
          }
        </label>

        <label class="full">
          <span>Password</span>
          <input type="password" formControlName="password" autocomplete="new-password" />
          @if (isInvalid('password')) {
            <small>Minimo 8 caracteres.</small>
          }
        </label>
      </div>

      @if (error()) {
        <p class="form-alert error">{{ error() }}</p>
      }

      @if (success()) {
        <p class="form-alert success">{{ success() }}</p>
      }

      <button class="primary-action" type="submit" [disabled]="loading()">
        @if (loading()) {
          <svg class="spin" lucideLoaderCircle aria-hidden="true"></svg>
        } @else {
          <svg lucideUserPlus aria-hidden="true"></svg>
        }
        <span>Crear cuenta</span>
      </button>
    </form>

    <p class="auth-switch">
      Ya tengo cuenta
      <a routerLink="/login">Entrar</a>
    </p>
  </section>
</main>
