<main class="auth-page register-page">
  <section class="auth-panel">
    <div class="auth-logo" aria-label="Ya Está Pago">
      <img class="auth-logo__image auth-logo__image--light" src="/brand/logo-light.png" alt="Ya Está Pago" />
      <img class="auth-logo__image auth-logo__image--dark" src="/brand/logo-dark.png" alt="" aria-hidden="true" />
    </div>

    <div class="auth-heading">
      <h3>Crea tu cuenta</h3>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field-grid">
        <yep-input
          label="Nombre"
          type="text"
          autocomplete="given-name"
          formControlName="firstName"
          [error]="isInvalid('firstName') ? 'Ingresa tu nombre.' : ''"
        />

        <yep-input
          label="Apellido"
          type="text"
          autocomplete="family-name"
          formControlName="lastName"
          [error]="isInvalid('lastName') ? 'Ingresa tu apellido.' : ''"
        />

        <yep-input
          label="Correo"
          type="email"
          autocomplete="email"
          formControlName="email"
          [error]="isInvalid('email') ? 'Ingresa un correo valido.' : ''"
        />

        <yep-input
          label="Identificación"
          type="text"
          autocomplete="off"
          formControlName="identificationNumber"
          [error]="isInvalid('identificationNumber') ? 'Ingresa tu número de identificación.' : ''"
        />

        <yep-input
          label="Celular"
          type="tel"
          autocomplete="tel"
          formControlName="cellphoneNumber"
          [error]="isInvalid('cellphoneNumber') ? 'Ingresa tu celular.' : ''"
        />

        <yep-input
          label="Contraseña"
          type="password"
          autocomplete="new-password"
          formControlName="password"
          [error]="isInvalid('password') ? 'Mínimo 8 caracteres.' : ''"
        />

        <yep-input
          label="Confirmar contraseña"
          type="password"
          autocomplete="new-password"
          formControlName="confirmPassword"
          [error]="isInvalid('confirmPassword') ? confirmPasswordError() : ''"
        />
      </div>

      @if (error()) {
        <yep-alert variant="error">{{ error() }}</yep-alert>
      }

      @if (success()) {
        <yep-alert variant="success">{{ success() }}</yep-alert>
      }

      <yep-button type="submit" [loading]="loading()" [disabled]="form.invalid || loading()" [fullWidth]="true">
        @if (!loading()) {
          <svg lucideUserPlus aria-hidden="true"></svg>
        }
        <span>{{ loading() ? 'Creando' : 'Crear cuenta' }}</span>
      </yep-button>
    </form>

    <p class="auth-switch">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </section>
</main>
