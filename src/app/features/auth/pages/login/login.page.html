<main class="auth-page">
  <section class="auth-panel">
    <div class="brand-mark">
      <svg lucideShieldCheck aria-hidden="true"></svg>
    </div>

    <div class="auth-heading">
      <p>Acceso seguro</p>
      <h1>yep_web</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <yep-input
        label="Email"
        type="email"
        autocomplete="email"
        formControlName="email"
        [error]="isInvalid('email') ? 'Ingresa un email valido.' : ''"
      />

      <yep-input
        label="Password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
        [error]="isInvalid('password') ? 'El password debe tener al menos 8 caracteres.' : ''"
      />

      @if (error()) {
        <yep-alert variant="error">{{ error() }}</yep-alert>
      }

      @if (success()) {
        <yep-alert variant="success">{{ success() }}</yep-alert>
      }

      <yep-button type="submit" [loading]="loading()" [disabled]="loading()" [fullWidth]="true">
        @if (!loading()) {
          <svg lucideLogIn aria-hidden="true"></svg>
        }
        <span>{{ loading() ? 'Entrando' : 'Entrar' }}</span>
      </yep-button>
    </form>

    <p class="auth-switch">
      Nueva cuenta
      <a routerLink="/register">Crear registro</a>
    </p>
  </section>
</main>
