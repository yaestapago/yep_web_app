<main class="auth-page">
  <section class="auth-panel">
    <div class="brand-mark">
      <svg lucideShieldCheck aria-hidden="true"></svg>
    </div>

    <div class="auth-heading">
      <p>Acceso seguro</p>
      <h1>yep_web</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (isInvalid('email')) {
          <small>Ingresa un email valido.</small>
        }
      </label>

      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (isInvalid('password')) {
          <small>El password debe tener al menos 6 caracteres.</small>
        }
      </label>

      @if (error()) {
        <p class="form-alert error">{{ error() }}</p>
      }

      @if (success()) {
        <p class="form-alert success">{{ success() }}</p>
      }

      <button class="primary-action" type="submit" [disabled]="loading()">
        @if (loading()) {
          <svg class="spin" lucideLoaderCircle aria-hidden="true"></svg>
        } @else {
          <svg lucideLogIn aria-hidden="true"></svg>
        }
        <span>Entrar</span>
      </button>
    </form>

    <p class="auth-switch">
      Nueva cuenta
      <a routerLink="/register">Crear registro</a>
    </p>
  </section>
</main>
