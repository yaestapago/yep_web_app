<main class="auth-page">
  <section class="auth-panel">
    <div class="auth-logo" aria-label="Ya Está Pago">
      <img class="auth-logo__image auth-logo__image--light" src="/brand/logo-light.png" alt="Ya Está Pago" />
      <img class="auth-logo__image auth-logo__image--dark" src="/brand/logo-dark.png" alt="" aria-hidden="true" />
    </div>

    <div class="auth-heading">
      <h3>Inicia sesión</h3>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <yep-input label="Correo" type="email" autocomplete="email" formControlName="email"
        [error]="isInvalid('email') ? 'Ingresa un correo valido.' : ''" />

      <yep-input label="Contraseña" type="password" autocomplete="current-password" formControlName="password"
        [error]="isInvalid('password') ? 'La contraseña debe tener al menos 8 caracteres.' : ''" />

      <a class="auth-recovery-link" routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>

      @if (error()) {
      <yep-alert variant="error">{{ error() }}</yep-alert>
      }

      @if (success()) {
      <yep-alert variant="success">{{ success() }}</yep-alert>
      }

      <yep-button type="submit" [loading]="loading()" [disabled]="form.invalid || loading()" [fullWidth]="true">
        @if (!loading()) {
        <svg lucideLogIn aria-hidden="true"></svg>
        }
        <span>{{ loading() ? 'Entrando' : 'Entrar' }}</span>
      </yep-button>
    </form>

    <p class="auth-switch">
      ¿No tienes cuenta?
      <a routerLink="/register">Regístrate</a>
    </p>
  </section>
</main>
