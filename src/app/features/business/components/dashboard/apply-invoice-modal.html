<yep-modal
  [open]="open()"
  title="Aplicar pago a factura"
  [subtitle]="
    required()
      ? 'Este negocio exige ' + label() + ' para confirmar el pago.'
      : 'Asocia este pago a una ' + label() + ' para poder buscarlo luego.'
  "
  size="sm"
  [loading]="saving()"
  (closeRequested)="close()"
>
  @if (transaction(); as tx) {
    <yep-description-list layout="inline">
      <yep-description-item label="Referencia" [mono]="!!tx.reference">{{
        tx.reference || 'Sin referencia'
      }}</yep-description-item>
      <yep-description-item label="Monto" [mono]="true">
        <span class="verify-amount">{{
          tx.amount | currency: tx.currency : 'symbol-narrow' : '1.0-0'
        }}</span>
      </yep-description-item>
    </yep-description-list>
  }

  @if (error()) {
    <yep-alert class="field-error" variant="error">{{ error() }}</yep-alert>
  }

  <form class="invoice-form" [formGroup]="form" (ngSubmit)="save()" id="apply-invoice-form">
    <yep-input
      formControlName="invoiceReference"
      [label]="label()"
      [placeholder]="label()"
      [required]="required()"
      [error]="fieldError()"
    />
  </form>

  <ng-container modalFooter>
    <yep-button variant="ghost" [disabled]="saving()" (clicked)="close()">
      {{ required() ? 'Cancelar' : 'Ahora no' }}
    </yep-button>
    <yep-button type="submit" [loading]="saving()" (clicked)="save()">
      {{ required() ? 'Confirmar pago' : 'Guardar' }}
    </yep-button>
  </ng-container>
</yep-modal>
