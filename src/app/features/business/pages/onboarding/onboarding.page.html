<main class="onboarding-page">
  <section class="onboarding-hero">
    <div>
      <p>Onboarding de negocio</p>
      <h1>Activa tu espacio de trabajo</h1>
      <span>{{ user()?.firstName }} {{ user()?.lastName }}</span>
    </div>

    <div class="hero-actions">
      <button class="secondary-action" type="button" (click)="openLogout()">
        <svg lucideLogOut aria-hidden="true"></svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </section>

  @if (error()) {
    <div class="form-alert error">
      <svg lucideTriangleAlert aria-hidden="true"></svg>
      <span>{{ error() }}</span>
    </div>
  }

  @if (success()) {
    <p class="form-alert success">{{ success() }}</p>
  }

  <section class="onboarding-grid">
    <article class="action-panel">
      <div class="panel-heading">
        <div>
          <p>Nuevo negocio</p>
          <h2>Crear negocio</h2>
        </div>
      </div>

      <form [formGroup]="businessForm" (ngSubmit)="createBusiness()" novalidate>
        <label>
          <span>Nombre</span>
          <input type="text" formControlName="name" autocomplete="organization" />
          @if (isBusinessInvalid('name')) {
            <small>Ingresa el nombre del negocio.</small>
          }
        </label>

        <yep-address-location-select
          formControlName="location"
          [required]="true"
          [error]="isBusinessInvalid('location') ? 'Selecciona departamento y ciudad.' : ''"
          dataCy="onboarding-business-location"
        />

        <label>
          <span>Direccion</span>
          <input type="text" formControlName="address" autocomplete="street-address" />
          @if (isBusinessInvalid('address')) {
            <small>Ingresa la direccion.</small>
          }
        </label>

        <yep-phone-input
          label="Teléfono"
          placeholder="300 123 4567"
          formControlName="phone"
          [required]="true"
          [error]="isBusinessInvalid('phone') ? 'Ingresa un teléfono válido.' : ''"
        ></yep-phone-input>

        <button class="primary-action" type="submit" [disabled]="creatingBusiness()">
          @if (creatingBusiness()) {
            <svg class="spin" lucideLoaderCircle aria-hidden="true"></svg>
          } @else {
            <svg lucideBuilding2 aria-hidden="true"></svg>
          }
          <span>Crear y usar</span>
        </button>
      </form>
    </article>
  </section>

  <yep-modal
    [open]="logoutModalOpen()"
    size="sm"
    title="Cerrar sesión"
    subtitle="¿Seguro que quieres cerrar sesión?"
    (closeRequested)="cancelLogout()"
  >
    <ng-container modalFooter>
      <yep-button variant="ghost" (clicked)="cancelLogout()">Cancelar</yep-button>
      <yep-button variant="danger" (clicked)="confirmLogout()">Cerrar sesión</yep-button>
    </ng-container>
  </yep-modal>
</main>
