<section class="page business-shell" [class.business-shell--immersive]="immersive()">
  @if (membership()) {
    @if (!immersive()) {
      <yep-page-header class="business-head" [title]="businessName()" [subtitle]="businessLocation()">
        <a slot="back" class="back-link" routerLink="/businesses">
          <svg lucideArrowLeft aria-hidden="true"></svg>
          <span>Negocios</span>
        </a>
        <yep-avatar slot="leading" [name]="businessName()" [size]="48" />
        <yep-status-chip slot="meta" class="role-chip" [label]="roleLabel()" [dot]="false" />
      </yep-page-header>
    }

    @if (billingBanner(); as banner) {
      <div
        class="billing-banner"
        [class.billing-banner--warning]="banner.tone === 'warning'"
        [class.billing-banner--info]="banner.tone === 'info'"
        role="status"
      >
        @if (banner.tone === 'warning') {
          <svg class="billing-banner__icon" lucideTriangleAlert aria-hidden="true"></svg>
        } @else {
          <svg class="billing-banner__icon" lucideClock aria-hidden="true"></svg>
        }
        <span class="billing-banner__text">{{ banner.text }}</span>
        @if (banner.cta; as cta) {
          <a class="billing-banner__cta" [routerLink]="cta.link">{{ cta.label }}</a>
        }
      </div>
    }

    <router-outlet />
  } @else {
    @if (!immersive()) {
      <a class="back-link" routerLink="/businesses">
        <svg lucideArrowLeft aria-hidden="true"></svg>
        <span>Negocios</span>
      </a>
    }
    <yep-state
      kind="empty"
      title="Negocio no encontrado"
      description="No tienes acceso aprobado a este negocio o el enlace ya no es válido."
    >
      <svg slot="icon" lucideStore aria-hidden="true"></svg>
    </yep-state>
  }
</section>
