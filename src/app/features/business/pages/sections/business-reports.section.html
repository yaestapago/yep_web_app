<div class="section">
  @if (error()) {
    <yep-alert variant="error">{{ error() }}</yep-alert>
  }

  <yep-card
    class="reports-card"
    title="Reporte de movimientos"
    subtitle="Movimientos del panel de control para el rango de fechas y la sede seleccionados, con detalle de monto, origen, banco, estado, cuentas y fecha de transferencia."
  >
    <div class="report-filters reports-card__filters">
      <yep-date-range-picker
        fieldLabel="Rango"
        [range]="range()"
        [preset]="preset()"
        (rangeChange)="onRangeChange($event)"
      />
      <yep-select
        class="report-filters__location"
        label="Sede"
        size="sm"
        [options]="locationOptions()"
        [ngModel]="locationId()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="onLocationChange($event)"
      />
    </div>

    <div slot="footer" class="reports-actions">
      <yep-button
        variant="secondary"
        [loading]="generatingCsv()"
        (clicked)="generateCashSummaryCsv()"
      >
        <svg lucideFileDown aria-hidden="true"></svg>
        Generar CSV
      </yep-button>
      <yep-button [loading]="generatingPdf()" (clicked)="generateCashSummary()">
        <svg lucideFileDown aria-hidden="true"></svg>
        Generar PDF
      </yep-button>
    </div>
  </yep-card>
</div>
